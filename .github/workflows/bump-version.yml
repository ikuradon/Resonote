name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Bump version
        id: bump
        run: |
          # Bump version without creating git tag
          pnpm version ${{ github.event.inputs.version_type }} --no-git-tag-version

          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name=release/v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create release branch and PR
        env:
          BRANCH_NAME: ${{ steps.bump.outputs.branch_name }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin "$BRANCH_NAME"

          # Create PR using GitHub CLI
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore: bump version to $NEW_VERSION" \
            --body "## Version Bump

          - **Version:** $NEW_VERSION
          - **Type:** $VERSION_TYPE

          ### Changes
          - Updated \`package.json\` version

          ### After Merge
          This PR will automatically create:
          - Git tag \`v$NEW_VERSION\`
          - GitHub Release with generated notes"
